<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>
      Generate a<br />
      <span>random password</span>
    </h1>
    <p>Never use an insecure password again.</p>
    <label class="length-control" for="password-length">
      Password length
      <div class="length-input-wrap">
        <input
          id="password-length"
          class="length-input"
          type="number"
          min="4"
          max="40"
          step="1"
          value="10"
        />
        <div class="length-spinner" aria-hidden="true">
          <button
            type="button"
            class="length-arrow length-arrow-up"
            aria-label="Increase password length"
          >
            ▲
          </button>
          <button
            type="button"
            class="length-arrow length-arrow-down"
            aria-label="Decrease password length"
          >
            ▼
          </button>
        </div>
      </div>
    </label>
    <button class="pass-generator-btn" onclick="randomPass()">
      Generate passwords
    </button>
    <div class="password-boxes">
      <button class="password-container password-container-one" type="button">
        Click to copy
      </button>
      <button class="password-container password-container-two" type="button">
        Click to copy
      </button>
    </div>
    <p class="copy-status" aria-live="polite">
      Generate a password, then tap either result to copy it.
    </p>
    <script src="script.js"></script>
    <script src="handler.js"></script>
  </body>
</html>
